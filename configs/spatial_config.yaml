spatial:
  target_date: "2024-01-01" # Or "latest"
  window_days: 14 # Time window to aggregate
  
  data:
    demographics_path: "data/processed/demographics_clean.csv"
    epidemiological_path: "data/processed/epidemiological_clean.csv"
    environmental_path: "data/processed/environmental_clean.csv"
    healthcare_stress_path: "data/healthcare/analytics/healthcare_stress.csv"
    healthcare_prep_path: "data/healthcare/analytics/healthcare_preparedness.csv"
    disease_forecasts_path: "data/forecasts/disease_forecasts.csv"
    boundary_file_path: "data/spatial/boundaries.geojson"

  clustering:
    primary_method: "kmeans"
    min_regions_required: 5
    n_clusters: 3
    random_state: 42
    scaler: "StandardScaler"
    
  dbscan:
    eps: 0.5
    min_samples: 3
    
  hotspot:
    min_regions_required: 10
    method: "local_morans_i" # hypothetical
    
  outputs:
    features_dir: "data/spatial"
    reports_dir: "reports/spatial"
    plots_dir: "reports/spatial/plots"
